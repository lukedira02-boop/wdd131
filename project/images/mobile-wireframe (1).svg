  <rect x="46" y="414" width="208" height="34" fill="#d9ecd2" stroke="#0d4d0d"/>
  <text x="150" y="435" text-anchor="middle" font-size="12" fill="#1a1a1a">Bird Card</text>

  <!-- Tips -->
