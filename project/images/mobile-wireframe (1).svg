<svg viewBox="0 0 300 600" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="300" height="600" fill="#1f7a1f"/>
  <rect x="1" y="1" width="298" height="598" fill="none" stroke="#0d4d0d" stroke-width="2"/>

