<body>

<header class="site-header">

    <a class="brand" href="index.html">

        <span class="brand-mark" aria-hidden="true">
            🦜
        </span>

        <span>
            Wildlife & Bird Watching Guide
        </span>

    <button class="menu-button"
            type="button"
            aria-label="Open navigation menu"

<main>

    <section class="page-banner">

        <p class="eyebrow">
            Species Directory
        </p>

        <h1>
            Meet the Birds
        </h1>

        <p>
            Explore common birds and learn about their habitats

        </p>

    <section class="section">

        <div class="filter-bar">

            <label for="habitat-filter">

        </div>

             class="bird-grid"
             aria-live="polite">

<script>
    // Fixup legacy/broken local image filenames that may still be referenced.
    (function(){
        function fix() {
            var fixes = {
                'african_fish_eagle.jpg': 'https://upload.wikimedia.org/wikipedia/commons/thumb/8/87/African_fish_eagle_%28Haliaeetus_vocifer%29_Ethiopia.jpg/960px-African_fish_eagle_%28Haliaeetus_vocifer%29_Ethiopia.jpg',
                'malachite_kingfisher.jpg': 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/cc/Common_Kingfisher_Alcedo_atthis.jpg/960px-Common_Kingfisher_Alcedo_atthis.jpg'
            };

            document.querySelectorAll('img').forEach(function(img){
                try {
                    var src = img.getAttribute('src') || '';
                    Object.keys(fixes).forEach(function(k){
                        if (src.indexOf(k) !== -1) {
                            img.src = fixes[k];
                        }
                    });
                } catch(e){}
            });
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fix);
        else fix();
    })();
</script>

</body>
</html>
