<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product Review Form - WDD 131 - Provide your feedback on products including rating, features, and written review.">
    <meta name="author" content="Dira Luke">
    <title>Product Review Form - WDD 131</title>

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>

<header>
    <h1>Product Review</h1>
</header>

<main>
    <form action="review.html" method="get">

        <!-- Product Name -->
        <fieldset>
            <legend>Product Information</legend>

            <label for="product">
                Product Name <span class="required">*</span>
            </label>

            <select id="product" name="product" required>
                <option value="" selected disabled>Select a Product ...</option>
            </select>

            <!-- Rating -->
            <p>Overall Rating <span class="required">*</span></p>

            <div class="rating">

                <input type="radio" id="star1" name="rating" value="1" required>
                <label for="star1">☆</label>

                <input type="radio" id="star2" name="rating" value="2">
                <label for="star2">☆☆</label>

                <input type="radio" id="star3" name="rating" value="3">
                <label for="star3">☆☆☆</label>

                <input type="radio" id="star4" name="rating" value="4">
                <label for="star4">☆☆☆☆</label>

                <input type="radio" id="star5" name="rating" value="5">
                <label for="star5">☆☆☆☆☆</label>

            </div>

            <!-- Installation Date -->

            <label for="installDate">
                Date of Installation <span class="required">*</span>
            </label>

            <input
                type="date"
                id="installDate"
                name="installDate"
                required>

        </fieldset>

        <!-- Features -->

        <fieldset>

            <legend>Useful Features</legend>

            <p>Check all that apply</p>

            <label for="durability">
                <input type="checkbox"
                       id="durability"
                       name="features"
                       value="Durability">
                Durability
            </label>

            <label for="ease">
                <input type="checkbox"
                       id="ease"
                       name="features"
                       value="Ease of Use">
                Ease of Use
            </label>

            <label for="performance">
                <input type="checkbox"
                       id="performance"
                       name="features"
                       value="Performance">
                Performance
            </label>

            <label for="design">
                <input type="checkbox"
                       id="design"
                       name="features"
                       value="Design">
                Design
            </label>

        </fieldset>

        <!-- Review -->

        <fieldset>

            <legend>Review</legend>

            <label for="review">
                Written Review (Optional)
            </label>

            <textarea
                id="review"
                name="review"
                rows="6"></textarea>

            <label for="username">
                Your Name (Optional)
            </label>

            <input
                type="text"
                id="username"
                name="username">

        </fieldset>

        <input
            class="submit-btn"
            type="submit"
            value="Post Review">

    </form>
</main>

<footer>
<p>
        &copy; <span id="currentyear"></span> |🌍 Dira Luke | Uganda🌍
    </p>

</footer>

</body>
</html>
