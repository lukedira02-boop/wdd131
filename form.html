<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Product Review Form for WDD 131 Dynamic Web Fundamentals. Submit product ratings, features, and feedback.">

<meta name="author" content="Dira Luke">


<title>Product Review Form - WDD 131</title>


<link rel="stylesheet" href="styles/form.css">

<script src="scripts/form.js" defer></script>


</head>


<body>


<header>

<h1>Product Review</h1>

</header>



<main>


<form action="review.html" method="get">


<fieldset>

<legend>Product Information</legend>


<label for="product">
Product Name <span class="required">*</span>
</label>


<select id="product" name="product" required>

<option value="" selected disabled>
Select a Product ...
</option>

</select>




<fieldset>


<legend>
Overall Rating <span class="required">*</span>
</legend>



<div class="rating">



<input 
type="radio"
id="rating1"
name="rating"
value="1"
required>

<label for="rating1">
☆
</label>




<input 
type="radio"
id="rating2"
name="rating"
value="2">

<label for="rating2">
☆☆
</label>




<input 
type="radio"
id="rating3"
name="rating"
value="3">

<label for="rating3">
☆☆☆
</label>




<input 
type="radio"
id="rating4"
name="rating"
value="4">

<label for="rating4">
☆☆☆☆
</label>




<input 
type="radio"
id="rating5"
name="rating"
value="5">

<label for="rating5">
☆☆☆☆☆
</label>



</div>


</fieldset>





<label for="installDate">

Date of Installation <span class="required">*</span>

</label>



<input 
type="date"
id="installDate"
name="installDate"
required>



</fieldset>





<fieldset>


<legend>Useful Features</legend>


<p>Check all that apply</p>



<input 
type="checkbox"
id="durability"
name="features"
value="Durability">

<label for="durability">
Durability
</label>





<input 
type="checkbox"
id="ease"
name="features"
value="Ease of Use">


<label for="ease">
Ease of Use
</label>





<input 
type="checkbox"
id="performance"
name="features"
value="Performance">


<label for="performance">
Performance
</label>





<input 
type="checkbox"
id="design"
name="features"
value="Design">


<label for="design">
Design
</label>




</fieldset>





<fieldset>


<legend>Review</legend>



<label for="review">

Written Review (Optional)

</label>



<textarea 
id="review"
name="review"
rows="6"></textarea>





<label for="username">

Your Name (Optional)

</label>


<input 
type="text"
id="username"
name="username">



</fieldset>





<input 
class="submit-btn"
type="submit"
value="Post Review">


</form>


</main>





<footer>


<p>
&copy; <span id="currentyear"></span> |
🌍 Dira Luke | Uganda 🌍
</p>


<p id="lastModified"></p>


</footer>



</body>

</html>
