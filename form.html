<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form - WDD 131</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    
    <main>
        <form method="get" action="review.html">
            
            <!-- Product Name -->
            <div class="field">
                <label for="productName">Product Name <span class="required">*</span></label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                    <!-- Dynamically populated via JavaScript -->
                </select>
            </div>

            <!-- Overall Rating -->
            <fieldset class="field">
                <legend>Overall Rating <span class="required">*</span></legend>
                <div class="rating-stars-container">
                    <div class="stars-display" aria-hidden="true">
                        <span>&#9733;</span>
                        <span>&#9733;&#9733;</span>
                        <span>&#9733;&#9733;&#9733;</span>
                        <span>&#9733;&#9733;&#9733;&#9733;</span>
                        <span>&#9733;&#9733;&#9733;&#9733;&#9733;</span>
                    </div>
                    <div class="rating-group">
                        <label><input type="radio" name="rating" value="1" required> 1</label>
                        <label><input type="radio" name="rating" value="2" required> 2</label>
                        <label><input type="radio" name="rating" value="3" required> 3</label>
                        <label><input type="radio" name="rating" value="4" required> 4</label>
                        <label><input type="radio" name="rating" value="5" required> 5</label>
                    </div>
                </div>
            </fieldset>

            <!-- Date of Installation -->
            <div class="field">
                <label for="installDate">Date of Installation <span class="required">*</span></label>
                <input type="date" id="installDate" name="installDate" required>
            </div>

            <!-- Useful Features -->
            <fieldset class="field">
                <legend>Which features did you find useful? <span class="optional">(Check all that apply)</span></legend>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="features" value="durability"> Durability</label>
                    <label><input type="checkbox" name="features" value="ease"> Ease of Use</label>
                    <label><input type="checkbox" name="features" value="performance"> Performance</label>
                    <label><input type="checkbox" name="features" value="design"> Design</label>
                </div>
            </fieldset>

            <!-- Written Review -->
            <div class="field">
                <label for="writtenReview">Written Review <span class="optional">(Optional)</span></label>
                <textarea id="writtenReview" name="writtenReview" rows="4" placeholder="Share your experience..."></textarea>
            </div>

            <!-- User Name -->
            <div class="field">
                <label for="userName">User Name <span class="optional">(Optional)</span></label>
                <input type="text" id="userName" name="userName" placeholder="Dira Luke">
            </div>

            <!-- Submit Button -->
            <div class="form-submit">
                <input type="submit" value="Post Review">
            </div>

        </form>
    </main>

    <footer>
        <p>&copy;<span id="currentyear"></span> 🌍 Dira Luke 🌍 Uganda</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
